<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modal de receita</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;color:#17201b;background:#f3efe5}
a{color:#183f32}a:hover{color:#0d281f}
input:focus{outline:2px solid #183f32;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 1024px; position: relative; overflow: hidden; font-family: 'Space Grotesk', system-ui, sans-serif; color: #17201b;">
<dc-import name="Dashboard" hint-size="1440px,1024px"></dc-import>
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(23, 32, 27, 0.4); display: flex; align-items: center; justify-content: center;">
<form role="dialog" aria-labelledby="t-rec" style="width: 520px; background: #fffaf0; border: 1px solid #d2cabb; box-shadow: 0 24px 64px rgba(23, 32, 27, 0.2); display: flex; flex-direction: column;">
<div style="padding: 32px 32px 24px; display: flex; flex-direction: column; gap: 16px; border-bottom: 1px solid #e0d9cb;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #183f32;">NOVA MOVIMENTAÇÃO</span>
<button type="button" aria-label="Fechar" style="width: 44px; height: 44px; margin: -12px -12px -12px 0; font: inherit; font-size: 20px; color: #526058; background: transparent; border: 0; cursor: pointer;">×</button>
</div>
<h2 id="t-rec" style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1;">Adicionar receita.</h2>
<div style="display: flex; align-items: center; gap: 12px;">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: #2f6b4f; background: #e8f2ec; border-radius: 2px;">↗ RECEITA</span>
<span style="font-size: 14px; color: #526058;">Tipo fixo · entra somando no saldo</span>
</div>
</div>
<div style="padding: 28px 32px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="desc-r" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">DESCRIÇÃO</label>
<input id="desc-r" type="text" value="Freelance landing page" style="height: 48px; padding: 0 16px; font: inherit; font-size: 16px; color: #17201b; background: #fffaf0; border: 1px solid #d2cabb; border-radius: 2px; box-sizing: border-box;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="val-r" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">VALOR</label>
<div style="display: flex; height: 56px; border: 1px solid #d2cabb; border-radius: 2px; background: #fffaf0;">
<span style="display: flex; align-items: center; padding: 0 16px; font-size: 18px; font-weight: 600; color: #2f6b4f; background: #e8f2ec; border-right: 1px solid #d2cabb;">+ R$</span>
<input id="val-r" type="text" inputmode="decimal" value="1.800,00" style="flex-grow: 1; min-width: 0; padding: 0 16px; font: inherit; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; color: #17201b; background: transparent; border: 0;">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: baseline; justify-content: space-between;">
<label for="data-r" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">DATA</label>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #183f32;">HOJE</span>
</div>
<input id="data-r" type="date" value="2026-09-23" max="2026-09-23" style="height: 48px; padding: 0 16px; font: inherit; font-size: 16px; font-variant-numeric: tabular-nums; color: #17201b; background: #fffaf0; border: 1px solid #d2cabb; border-radius: 2px; box-sizing: border-box;">
<span style="font-size: 13px; color: #526058;">Preenchida com hoje. Altere para lançar algo que já aconteceu.</span>
</div>
</div>
<div style="padding: 20px 32px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #e0d9cb; background: #f3efe5;">
<button type="button" style="height: 48px; padding: 0 20px; font: inherit; font-size: 15px; font-weight: 600; color: #17201b; background: transparent; border: 1px solid #d2cabb; border-radius: 2px; cursor: pointer;">Cancelar</button>
<button type="submit" style="height: 48px; padding: 0 24px; font: inherit; font-size: 15px; font-weight: 600; color: #fffaf0; background: #17201b; border: 0; border-radius: 2px; cursor: pointer;">Salvar receita</button>
</div>
</form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1024}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
