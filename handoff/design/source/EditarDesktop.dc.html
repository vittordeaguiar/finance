<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editar movimentação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;color:#17201b;background:#f3efe5}
a{color:#183f32}a:hover{color:#0d281f}
input:focus{outline:2px solid #183f32;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 1100px; position: relative; overflow: hidden; font-family: 'Space Grotesk', system-ui, sans-serif; color: #17201b;">
<dc-import name="DashboardMes" hint-size="1440px,1100px"></dc-import>
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(23, 32, 27, 0.4); display: flex; align-items: center; justify-content: center;">
<form role="dialog" aria-labelledby="ed-t" style="width: 520px; background: #fffaf0; border: 1px solid #d2cabb; box-shadow: 0 24px 64px rgba(23, 32, 27, 0.2); display: flex; flex-direction: column;">
<div style="padding: 32px 32px 20px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #e0d9cb;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #183f32;">EDITAR MOVIMENTAÇÃO</span>
<button type="button" aria-label="Fechar" disabled="{{saving}}" style="width: 44px; height: 44px; margin-right: -12px; font: inherit; font-size: 22px; color: #526058; background: transparent; border: 0; cursor: pointer;">×</button>
</div>
<h2 id="ed-t" style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1;">Editar despesa.</h2>
</div>
<div style="padding: 24px 32px; display: flex; flex-direction: column; gap: 18px;">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
<legend style="padding: 0; margin-bottom: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">TIPO</legend>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #d2cabb; border-radius: 2px;">
<button type="button" role="radio" aria-checked="false" style="height: 44px; font: inherit; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: #526058; background: #fffaf0; border: 0; border-right: 1px solid #d2cabb; cursor: pointer;">↗ RECEITA</button>
<button type="button" role="radio" aria-checked="true" style="height: 44px; font: inherit; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #b42318; background: #f8e8e6; border: 0; box-shadow: inset 0 0 0 2px #b42318; cursor: pointer;">↘ DESPESA</button>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="e-desc" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">DESCRIÇÃO</label>
<input id="e-desc" type="text" value="Supermercado" disabled="{{saving}}" style="height: 48px; padding: 0 16px; font: inherit; font-size: 16px; color: #17201b; background: #fffaf0; border: 1px solid #d2cabb; border-radius: 2px; box-sizing: border-box; opacity: {{op}};">
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: baseline; justify-content: space-between;">
<label for="e-val" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">VALOR</label>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #183f32;">ALTERADO · ERA R$ 412,80</span>
</div>
<div style="display: flex; height: 56px; border: 1px solid #183f32; border-radius: 2px; background: #fffaf0; opacity: {{op}};">
<span style="display: flex; align-items: center; padding: 0 16px; font-size: 18px; font-weight: 600; color: #b42318; background: #f8e8e6; border-right: 1px solid #d2cabb; white-space: nowrap;">− R$</span>
<input id="e-val" type="text" inputmode="decimal" value="432,80" disabled="{{saving}}" style="flex-grow: 1; min-width: 0; padding: 0 16px; font: inherit; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; color: #17201b; background: transparent; border: 0;">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="e-data" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">DATA</label>
<input id="e-data" type="date" value="2026-09-22" max="2026-09-23" disabled="{{saving}}" style="height: 48px; padding: 0 16px; font: inherit; font-size: 16px; font-variant-numeric: tabular-nums; color: #17201b; background: #fffaf0; border: 1px solid #d2cabb; border-radius: 2px; box-sizing: border-box; opacity: {{op}};">
</div>
<div style="padding: 12px 14px; background: #e7eee8; border-left: 3px solid #3f624f; font-size: 14px; line-height: 1.5;">O saldo passa de <strong style="font-variant-numeric: tabular-nums;">R$ 5.839,75</strong> para <strong style="font-variant-numeric: tabular-nums;">R$ 5.819,75</strong>.</div>
</div>
<div style="padding: 20px 32px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #e0d9cb; background: #f3efe5;">
<button type="button" disabled="{{saving}}" style="height: 48px; padding: 0 20px; font: inherit; font-size: 15px; font-weight: 600; color: #17201b; background: transparent; border: 1px solid #d2cabb; border-radius: 2px; cursor: pointer;">Cancelar</button>
<button type="submit" disabled="{{saving}}" aria-busy="{{saving}}" style="height: 48px; padding: 0 24px; font: inherit; font-size: 15px; font-weight: 600; color: #fffaf0; background: {{saveBg}}; border: 0; border-radius: 2px; cursor: pointer;">{{saveLabel}}</button>
</div>
</form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etapa":{"editor":"enum","options":["editar","salvando"],"default":"editar"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
var e = this.props.etapa || 'editar';
var saving = e === 'salvando';
return {
detalhe: e === 'detalhe', editar: e !== 'detalhe', saving: saving,
op: saving ? '0.6' : '1',
saveBg: saving ? '#526058' : '#17201b',
saveLabel: saving ? 'Salvando…' : 'Salvar alterações'
};
}
}
</script>
</body>
</html>
