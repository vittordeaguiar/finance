<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cadastro.dc.html</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"><style>
body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;color:#17201b;background:#f3efe5}
a{color:#183f32}a:hover{color:#0d281f}
input:focus{outline:2px solid #183f32;outline-offset:2px}
</style></head>
<body style="margin:0">




<div style="width: 1440px; height: 900px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #f3efe5; font-family: 'Space Grotesk', system-ui, sans-serif; color: #17201b;">
<div style="background: #111815; color: #f3efe5; padding: 64px; display: flex; flex-direction: column; justify-content: space-between;">
<div style="display: flex; align-items: center; gap: 12px;">
<div style="width: 28px; height: 28px; background: #8ab39e;"></div>
<span style="font-size: 22px; font-weight: 700; letter-spacing: -0.03em;">Saldo.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 24px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #8ab39e;">01 · FINANÇAS PESSOAIS</span>
<h1 style="margin: 0; font-size: 72px; line-height: 1.02; font-weight: 600; letter-spacing: -0.045em;">Comece do <span style="color: #8ab39e;">zero.</span></h1>
<p style="margin: 0; max-width: 46ch; font-size: 18px; line-height: 1.65; color: #abb5ae;">Crie a conta e registre a primeira movimentação em menos de um minuto.</p>
</div>
<div style="display: flex; gap: 24px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #abb5ae; border-top: 1px solid #2a352e; padding-top: 24px;">
<span>RECEITAS</span><span>·</span><span>DESPESAS</span><span>·</span><span>SALDO</span>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: center; padding: 64px;">
<form style="width: 400px; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; flex-direction: column; gap: 12px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #183f32;">CADASTRO</span>
<h2 style="margin: 0; font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1;">Criar conta.</h2>
</div>
<div style="display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="c-nome" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">NOME</label>
<input id="c-nome" value="" type="text" placeholder="Como quer ser chamado" style="height: 48px; padding: 0px 16px; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-size: 16px; color: rgb(23, 32, 27); background: rgb(255, 250, 240); border: 1px solid rgb(210, 202, 187); border-radius: 2px; box-sizing: border-box;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="c-email" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">EMAIL</label>
<input id="c-email" value="" type="email" placeholder="voce@email.com" style="height: 48px; padding: 0px 16px; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-size: 16px; color: rgb(23, 32, 27); background: rgb(255, 250, 240); border: 1px solid rgb(210, 202, 187); border-radius: 2px; box-sizing: border-box;">

</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="c-senha" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">SENHA</label>
<input id="c-senha" value="" type="password" style="height: 48px; padding: 0px 16px; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-size: 16px; color: rgb(23, 32, 27); background: rgb(255, 250, 240); border: 1px solid rgb(210, 202, 187); border-radius: 2px; box-sizing: border-box;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #526058;">MÍNIMO DE 8 CARACTERES</span>

</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="c-conf" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #526058;">CONFIRMAR SENHA</label>
<input id="c-conf" value="" type="password" style="height: 48px; padding: 0px 16px; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-size: 16px; color: rgb(23, 32, 27); background: rgb(255, 250, 240); border: 1px solid rgb(210, 202, 187); border-radius: 2px; box-sizing: border-box;">

</div>
</div>
<button type="submit" style="height: 52px; font: inherit; font-size: 16px; font-weight: 600; color: #fffaf0; background: #17201b; border: 0; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;"><span>Criar conta</span><span>→</span></button>
<p style="margin: 0; padding-top: 20px; border-top: 1px solid #d2cabb; font-size: 14px; color: #526058;">Já tem conta? <a href="#">Entrar</a></p>
</form>
</div>
</div>
</body></html>
