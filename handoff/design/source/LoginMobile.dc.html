<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Login mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;color:#17201b;background:#f3efe5}
a{color:#183f32}a:hover{color:#0d281f}
input:focus{outline:2px solid #183f32;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #f3efe5; font-family: 'Space Grotesk', system-ui, sans-serif; color: #17201b; display: flex; flex-direction: column;">
<div style="background: #111815; color: #f3efe5; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 48px;">
<div style="display: flex; align-items: center; gap: 10px;">
<div style="width: 20px; height: 20px; background: #8ab39e;"></div>
<span style="font-size: 19px; font-weight: 700; letter-spacing: -0.03em;">Saldo.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8ab39e;">01 · FINANÇAS PESSOAIS</span>
<h1 style="margin: 0; font-size: 40px; line-height: 1.02; font-weight: 600; letter-spacing: -0.045em;">Seu dinheiro, <span style="color: #8ab39e;">em ordem.</span></h1>
</div>
</div>
<form style="padding: 28px 20px 28px; display: flex; flex-direction: column; gap: 18px; flex-grow: 1;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #183f32;">ACESSO</span>
<h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.03em;">Entrar na conta.</h2>
</div>
<sc-if value="{{erro}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="padding: 14px 16px; background: #f8e8e6; border-left: 3px solid #b42318; display: flex; flex-direction: column; gap: 4px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #b42318;">NÃO FOI POSSÍVEL ENTRAR</span>
<span style="font-size: 15px; line-height: 1.5;">Email ou senha incorretos. Confira e tente de novo.</span>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="lm-email" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #526058;">EMAIL</label>
<input id="lm-email" type="email" autocomplete="email" value="{{email}}" placeholder="voce@email.com" disabled="{{busy}}" style="height: 52px; padding: 0 16px; font: inherit; font-size: 17px; color: #17201b; background: #fffaf0; border: 1px solid {{fieldBorder}}; border-radius: 2px; box-sizing: border-box;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: baseline; justify-content: space-between;">
<label for="lm-senha" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #526058;">SENHA</label>
<a href="RecuperarSenhaMobile.dc.html" style="font-size: 14px; font-weight: 500;">Esqueci minha senha</a>
</div>
<input id="lm-senha" type="password" autocomplete="current-password" value="{{senha}}" disabled="{{busy}}" style="height: 52px; padding: 0 16px; font: inherit; font-size: 17px; color: #17201b; background: #fffaf0; border: 1px solid {{fieldBorder}}; border-radius: 2px; box-sizing: border-box;">
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px;">
<button type="submit" disabled="{{busy}}" aria-busy="{{busy}}" style="height: 56px; font: inherit; font-size: 16px; font-weight: 600; color: #fffaf0; background: {{btnBg}}; border: 0; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;"><span>{{btnLabel}}</span><span>→</span></button>
<p style="margin: 0; text-align: center; font-size: 15px; color: #526058;">Ainda não tem conta? <a href="#">Criar conta</a></p>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["padrao","erro","entrando"],"default":"padrao"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var e = this.props.estado || 'padrao';
return {
erro: e === 'erro', busy: e === 'entrando',
email: e === 'padrao' ? '' : 'voce@email.com',
senha: e === 'padrao' ? '' : 'senhasecreta',
fieldBorder: e === 'erro' ? '#b42318' : '#d2cabb',
btnBg: e === 'entrando' ? '#526058' : '#17201b',
btnLabel: e === 'entrando' ? 'Entrando…' : 'Entrar'
};
}
}
</script>
</body>
</html>
