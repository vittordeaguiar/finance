<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>CadastroMobile.dc.html</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"><style>
body{margin:0;font-family:"Space Grotesk",system-ui,sans-serif;color:#17201b;background:#f3efe5}
a{color:#183f32}a:hover{color:#0d281f}
input:focus{outline:2px solid #183f32;outline-offset:2px}
</style></head>
<body style="margin:0">




<div style="width: 390px; height: 844px; overflow: hidden; background: #f3efe5; font-family: 'Space Grotesk', system-ui, sans-serif; color: #17201b; display: flex; flex-direction: column;">
<div style="background: #111815; color: #f3efe5; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; align-items: center; gap: 10px;">
<div style="width: 20px; height: 20px; background: #8ab39e;"></div>
<span style="font-size: 19px; font-weight: 700; letter-spacing: -0.03em;">Saldo.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8ab39e;">CADASTRO</span>
<h1 style="margin: 0; font-size: 36px; line-height: 1.05; font-weight: 600; letter-spacing: -0.045em;">Criar <span style="color: #8ab39e;">conta.</span></h1>
</div>
</div>
<form style="padding: 24px 20px 28px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="cm-nome" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #526058;">NOME</label>
<input id="cm-nome" value="" type="text" autocomplete="name" style="height: 52px; padding: 0px 16px; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-size: 17px; color: rgb(23, 32, 27); background: rgb(255, 250, 240); border: 1px solid rgb(210, 202, 187); border-radius: 2px; box-sizing: border-box;">
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="cm-email" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #526058;">EMAIL</label>
<input id="cm-email" value="" type="email" autocomplete="email" placeholder="voce@email.com" style="height: 52px; padding: 0px 16px; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-size: 17px; color: rgb(23, 32, 27); background: rgb(255, 250, 240); border: 1px solid rgb(210, 202, 187); border-radius: 2px; box-sizing: border-box;">

</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="cm-senha" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #526058;">SENHA</label>
<input id="cm-senha" value="" type="password" autocomplete="new-password" style="height: 52px; padding: 0px 16px; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-size: 17px; color: rgb(23, 32, 27); background: rgb(255, 250, 240); border: 1px solid rgb(210, 202, 187); border-radius: 2px; box-sizing: border-box;">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #526058;">MÍNIMO DE 8 CARACTERES</span>

</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="cm-conf" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #526058;">CONFIRMAR SENHA</label>
<input id="cm-conf" value="" type="password" autocomplete="new-password" style="height: 52px; padding: 0px 16px; font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-size: 17px; color: rgb(23, 32, 27); background: rgb(255, 250, 240); border: 1px solid rgb(210, 202, 187); border-radius: 2px; box-sizing: border-box;">

</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px;">
<button type="submit" style="height: 56px; font: inherit; font-size: 16px; font-weight: 600; color: #fffaf0; background: #17201b; border: 0; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;"><span>Criar conta</span><span>→</span></button>
<p style="margin: 0; text-align: center; font-size: 15px; color: #526058;">Já tem conta? <a href="#">Entrar</a></p>
</div>
</form>
</div>
</body></html>
